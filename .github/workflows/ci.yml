name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /api/v1

  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./guidia_test.db
      TEST_DATABASE_URL: file:./guidia_test.db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ml/training/check_data.py --task intent
      - run: python ml/training/check_data.py --task safety
      - run: pip install -r ml-service/requirements-dev.txt
      - run: pytest
        working-directory: ml-service
