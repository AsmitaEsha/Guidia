<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Guidia</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <span class="brand">
          <img src="icon.png" width="34" height="34" alt="" />
          <strong>Guidia</strong>
        </span>
        <span id="conn" class="conn" data-on="false"><span class="dot" aria-hidden="true"></span><span id="conn-text">Not connected</span></span>
      </header>

      <section id="connect" hidden aria-labelledby="connect-h">
        <h1 id="connect-h" data-i18n="connectTitle">Connect Guidia</h1>
        <ol class="how">
          <li data-i18n="connectStep1">Open Guidia → Settings → Browser helper.</li>
          <li data-i18n="connectStep2">Press “Connect the extension”.</li>
          <li data-i18n="connectStep3">Type the 8-character code below.</li>
        </ol>
        <label for="code" data-i18n="codeLabel">Code</label>
        <input id="code" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD EFGH" />
        <button id="pair" class="primary" data-i18n="connect">Connect</button>
        <button id="open-settings" class="link" type="button" data-i18n="openSettings">Open Guidia settings</button>
      </section>

      <section id="ready" hidden aria-labelledby="ready-h">
        <h1 id="ready-h" data-i18n="readyTitle">Understand this page</h1>
        <p class="privacy">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span data-i18n="privacy">Guidia will capture the visible page only when you press the button. Banking and password pages are never captured.</span>
        </p>
        <label for="question" data-i18n="questionLabel">Your question (optional)</label>
        <input id="question" maxlength="200" data-i18n-placeholder="questionPlaceholder" placeholder="What should I press next?" />
        <button id="capture" class="primary" data-i18n="capture">Capture &amp; explain</button>
        <div class="row">
          <button id="open-app" class="secondary" type="button" data-i18n="openApp">Open Guidia</button>
          <button id="disconnect" class="link" type="button" data-i18n="disconnect">Disconnect</button>
        </div>
      </section>

      <div id="status" class="status" role="status" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-text"></span>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
